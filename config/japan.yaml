# =====================================================================
# ญี่ปุ่น (คันโต – คันไซ) — ทับเฉพาะค่าที่ต่างจาก default.yaml (ไทย)
#   python scripts/preprocess_ahi.py --hsd-dir data/Japan/satellite/hsd --out-dir runs/jp/scans --config config/japan.yaml
#
# ฟิสิกส์เดียวกับไทย ต่างกันที่เกณฑ์อุณหภูมิที่ผูกกับความสูงโทรโพพอส:
#   ยอดเมฆลึกของญี่ปุ่นอุ่นกว่าไทยราว 10 K (โทรโพพอสต่ำกว่า) → เกณฑ์ deep convection / แกน / รอยเมฆ +10 K
#   เกณฑ์ที่ผูกกับเฟสน้ำแข็ง (273 / 253 K) เท่าเดิม เพราะขึ้นกับอุณหภูมิที่น้ำแข็งก่อตัว ไม่ใช่ความสูง
# ค่าคงที่ของส่วนทำนาย (convrain/scope/constants) ใช้ชุดญี่ปุ่น (timing.constants: japan)
# =====================================================================
domain:
  lat_min: 33.5
  lat_max: 37.5
  lon_min: 134.0
  lon_max: 141.5

satellite:
  area: JP01                # ภาพพื้นที่ญี่ปุ่น (สแกนทุก 2.5 นาที) ใช้ภาพย่อยแรกของทุก 10 นาที

detect:
  thresholds_k: [273.0, 253.0, 245.0, 230.0]   # = ไทย [273, 253, 235, 220] โดย 2 ระดับเย็น +10 K

timing:
  constants: japan
  footprint_k: 248.0        # ไทย 238
  core_k: 245.0             # ไทย 235
  parallax_top_k: 230.0     # ไทย 220
